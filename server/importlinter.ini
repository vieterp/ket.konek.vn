; Luật phụ thuộc — plan.md §Bố cục solution, ADR-004.
; Chạy: lint-imports --config importlinter.ini
;
; Bảy luật trong plan.md ánh xạ sang contract dưới đây:
;   1. modules.* → kernel, posting; không module nào import module khác  → C2, C3
;   2. cần dữ liệu module khác → Protocol trong kernel / domain event      → hệ quả của C3
;   3. chỉ posting được INSERT vào gl_postings                            → C4 (+ review, không ép được bằng import)
;   4. reporting chỉ đọc                                                  → C5
;   5. kernel không import modules.* hay posting                          → C1
;   6. web UI chỉ biết REST + type sinh từ OpenAPI                        → phía client, ép bằng eslint/tsc
;   7. không dict[str, Any] qua ranh giới module                          → mypy strict + review (ADR-015)

[importlinter]
root_packages =
    ket
include_external_packages = False

[importlinter:contract:kernel-independence]
name = C1 — kernel không phụ thuộc api/admin/posting/reporting/modules/worker
type = forbidden
source_modules =
    ket.kernel
forbidden_modules =
    ket.admin
    ket.api
    ket.posting
    ket.reporting
    ket.modules
    ket.worker

[importlinter:contract:layering]
name = C2 — phân tầng: api/admin/worker trên modules, modules trên posting, posting trên kernel
type = layers
layers =
    api | admin | worker
    modules
    posting
    kernel
containers =
    ket

; `worker` là tiến trình chạy job nặng nên được phép dùng mọi tầng dưới; ngược
; lại không tầng nào được import `worker` (nếu không, gọi job sẽ lén thành gọi
; hàm đồng bộ và mất tính "chạy nền có tiến độ/hủy" — ADR-014).
;
; `api` (tầng HTTP: FastAPI) đứng **ngang hàng và độc lập** với `worker`, không
; phải trên nó: `api` import `worker` sẽ biến một job nền thành lời gọi đồng bộ
; ngay trong request, còn `worker` import `api` sẽ kéo FastAPI vào tiến trình
; chạy job. Cả hai đều được dùng mọi tầng dưới.
;
; `admin` (CLI chạy tại máy chủ) là điểm vào thứ ba, cùng tầng và cũng độc lập:
; `admin` import `api` sẽ kéo FastAPI vào một tiến trình chạy một lệnh rồi thoát,
; còn `api` import `admin` là mở đường cho thao tác phá-kính chạy qua HTTP —
; đúng thứ mà việc đặt chúng ở CLI sinh ra để chặn.
;
; Ràng buộc "kernel không biết FastAPI" nằm ở C1, và nó là thứ giữ cho
; `ket.admin` cùng `ket.worker` gọi được dịch vụ nghiệp vụ mà không phải dựng
; request giả.

[importlinter:contract:module-isolation]
name = C3 — không module nghiệp vụ nào import module nghiệp vụ khác
type = independence
modules =
    ket.modules.cash_book
    ket.modules.bank
    ket.modules.purchase
    ket.modules.sales
    ket.modules.einvoice
    ket.modules.inventory
    ket.modules.tools
    ket.modules.fixed_assets
    ket.modules.tax
    ket.modules.payroll
    ket.modules.costing
    ket.modules.general_ledger
    ket.modules.receivables
    ket.modules.warehousing

[importlinter:contract:posting-independence]
name = C4 — posting chỉ dựa vào kernel (không biết module nào tồn tại)
type = forbidden
source_modules =
    ket.posting
forbidden_modules =
    ket.modules
    ket.reporting

[importlinter:contract:reporting-read-only]
name = C5 — reporting chỉ đọc: không import posting (đường ghi) hay module nghiệp vụ
type = forbidden
source_modules =
    ket.reporting
forbidden_modules =
    ket.posting
    ket.modules
