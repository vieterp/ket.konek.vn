; Alembic — migration cho từng PG schema dataset (ADR-017 schema-per-dataset).
; URL thật lấy từ konek.settings lúc chạy (env.py), KHÔNG ghi credential vào file này.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
# sqlalchemy.url cố tình để trống — env.py nạp từ settings/OS keystore.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
