[project]
name = "konek-accounting-server"
version = "0.1.0"
description = "Konek — app server phần mềm kế toán VN (TT200/TT133), chạy LAN hoặc offline một máy"
requires-python = "==3.12.*"
license = { text = "Proprietary" }

# Chỉ khai dependency đã dùng ở phase hiện tại (phase-01 §Risk: "không thêm
# dependency nào chưa dùng"). Thư viện của phase sau (WeasyPrint, openpyxl,
# lxml…) thêm khi phase đó bắt đầu.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konek"]

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming (snake_case hàm/biến, PascalCase class — ADR-015)
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "ANN",       # flake8-annotations — mọi def phải có annotation (ADR-015)
    "S",         # flake8-bandit
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez — cấm datetime naive cho dấu vết audit
    "T20",       # cấm print() trong code nghiệp vụ
    "RUF",
]
ignore = [
    "E501",     # độ dài dòng do formatter lo
    # Docstring và thông điệp lỗi viết bằng tiếng Việt nên chứa dấu tiếng Việt,
    # en dash, dấu nháy cong… RUF001/002/003 coi đó là ký tự "mơ hồ" và báo
    # hàng loạt. Tắt có chủ đích — chuỗi hiển thị cho người dùng không nằm
    # trong code nghiệp vụ (server trả `error_code`, client dựng thông điệp).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test được phép assert và dùng đường dẫn cố định.
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-annotations]
# `self`/`cls` không cần annotation; mọi thứ còn lại phải có.
suppress-none-returning = false
mypy-init-return = true

# ---------------------------------------------------------------------------
# mypy — strict, KHÔNG ngoại lệ per-module (phase-01 bước 6: repo còn rỗng,
# đây là lúc duy nhất dễ). Thêm ngoại lệ về sau phải kèm lý do + review.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["konek"]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_unreachable = true
# `# type: ignore` trần bị cấm — phải nêu mã lỗi và lý do (ADR-015).
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
