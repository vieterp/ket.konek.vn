[project]
name = "ket-server"
version = "0.13.0"
description = "Konek Két — app server phần mềm kế toán VN (TT200/TT133), chạy LAN hoặc offline một máy"
requires-python = "==3.12.*"
license = { text = "Proprietary" }

# Chỉ khai dependency đã dùng ở phase hiện tại (phase-01 §Risk: "không thêm
# dependency nào chưa dùng"). Thư viện của phase sau (WeasyPrint, openpyxl,
# lxml…) thêm khi phase đó bắt đầu.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19",
    "psycopg[binary]>=3.3",
    "structlog>=26.1",
    # Danh tính (lát 2B-1a). Bốn thư viện, mỗi thư viện một việc không nên tự viết:
    "argon2-cffi>=25.1",   # băm mật khẩu Argon2id (FR-NFR-010)
    "cryptography>=46",    # Fernet cho bí mật lưu trong DB (ADR-019, RT-05)
    "pyotp>=2.9",          # TOTP RFC 6238 (FR-NFR-016)
    "keyring>=25.6",       # OS keystore: Keychain / Credential Manager (ADR-019)
    # Đính kèm tệp (lát 2C-5). FastAPI đọc `multipart/form-data` qua thư viện
    # này; thiếu nó thì endpoint tải tệp lên hỏng **lúc dựng ứng dụng**, không
    # phải lúc có ai gọi (FR-NFR-053).
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "import-linter>=2.13",
    "pytest-cov>=7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ket"]

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming (snake_case hàm/biến, PascalCase class — ADR-015)
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "ANN",       # flake8-annotations — mọi def phải có annotation (ADR-015)
    "S",         # flake8-bandit
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez — cấm datetime naive cho dấu vết audit
    "T20",       # cấm print() trong code nghiệp vụ
    "RUF",
]
ignore = [
    "E501",     # độ dài dòng do formatter lo
    # Docstring và thông điệp lỗi viết bằng tiếng Việt nên chứa dấu tiếng Việt,
    # en dash, dấu nháy cong… RUF001/002/003 coi đó là ký tự "mơ hồ" và báo
    # hàng loạt. Tắt có chủ đích — chuỗi hiển thị cho người dùng không nằm
    # trong code nghiệp vụ (server trả `error_code`, client dựng thông điệp).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test được phép assert và dùng đường dẫn cố định.
# S608: test phải ghép tên schema vào SQL để kiểm chính cơ chế định tuyến schema
# và quyền trên `alembic_version` — tên schema đến từ fixture, không từ dữ liệu
# ngoài. Trong `src/` thì luật này vẫn bật.
# S105/S106: test danh tính phải có mật khẩu dạng chữ trong mã — đó chính là dữ
# liệu đầu vào của nó. Bí mật thật không bao giờ nằm trong repo (ADR-019).
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.ruff.lint.flake8-annotations]
# `self`/`cls` không cần annotation; mọi thứ còn lại phải có.
suppress-none-returning = false
mypy-init-return = true

# ---------------------------------------------------------------------------
# mypy — strict, KHÔNG ngoại lệ per-module (phase-01 bước 6: repo còn rỗng,
# đây là lúc duy nhất dễ). Thêm ngoại lệ về sau phải kèm lý do + review.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ket"]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_unreachable = true
# `# type: ignore` trần bị cấm — phải nêu mã lỗi và lý do (ADR-015).
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    # Cần một PostgreSQL thật (RLS, tách quyền owner/app, định tuyến schema
    # không mô phỏng được bằng SQLite hay mock). Chạy: `make server-test-db`.
    # CI chạy nhóm này trong job riêng có service PostgreSQL; job đa-OS chạy
    # `-m 'not db'` vì service container chỉ có trên runner Linux.
    "db: cần PostgreSQL thật (bỏ qua khi không kết nối được)",
]

# ---------------------------------------------------------------------------
# coverage — báo cáo trong PR (không phải cổng chặn)
#
# Đo trên `src/ket`: đây là mã nghiệp vụ. Migration KHÔNG đo — nó chạy đúng một
# lần cho mỗi schema và độ phủ của nó là câu hỏi khác (bảng có được tạo đúng
# không), đã có `test_migrations_match_models` canh.
#
# Con số chỉ có nghĩa khi gộp cả hai nhóm test: phần lớn `kernel/security` và
# `kernel/datasets` chỉ chạy trong nhóm `db`. Đo riêng nhóm không-DB sẽ cho ra
# một con số thấp gây hiểu nhầm.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["ket"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
