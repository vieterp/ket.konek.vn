[package]
name = "ket"
version = "0.19.0"
description = "Konek Két — desktop shell"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "ket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Shell chỉ giữ đúng bốn việc: cập nhật, in ấn, chọn/lưu tệp, giữ phiên.
# KHÔNG có logic nghiệp vụ ở tầng Rust — mọi phép tính tiền ở app server.
# Plugin updater (mã Rust chạy lúc runtime: hỏi server có bản mới không, tải,
# cài) thêm ở phase 2C bước 18 / phase 11 — nó cần endpoint đặt lúc chạy, vì
# địa chỉ app server là của từng bản cài chứ không biết lúc build.
#
# Phần **đóng gói** thì đã bật từ bây giờ: `bundle.createUpdaterArtifacts` +
# `plugins.updater.pubkey` trong `tauri.conf.json`, và workflow `release.yml`
# ký gói bằng khóa trong GitHub Secrets rồi sinh `latest.json`. Tách hai phần
# như vậy để kênh phát hành có sản phẩm ký đúng ngay từ bản 0.x, thay vì tới
# lúc bật updater mới phát hiện mọi bản cũ đều không cập nhật được.
#
# `tauri-plugin-fs` cố tình KHÔNG có ở phase 1: chưa luồng nào đọc/ghi tệp, và
# quyền fs tương ứng cũng chưa cấp trong `capabilities/default.json`. Thêm ở
# phase cần nó, cùng lúc với phạm vi quyền hẹp.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# `tauri::generate_context!` sinh mã đọc khối `plugins` của `tauri.conf.json`
# thành `serde_json::Value`, nên crate này bắt buộc có mặt từ lúc khối đó tồn
# tại — kể cả khi plugin tương ứng chưa được nạp ở tầng Rust. Không có nó,
# build đỏ với "could not find `serde_json`", một thông điệp không hề nhắc tới
# tệp cấu hình vừa sửa.
serde_json = "1"
tauri-plugin-updater = "2"
