<!--
  Nguồn: brand asset `uploads/brand-assets/logos/konek-icon-clean.svg`
  (Claude Design project 91a2c87a-3304-418f-a296-dc584cd56cfe).

  Khác biệt duy nhất so với bản gốc: bọc trong khung VUÔNG 440x440 và dời dấu
  hiệu xuống 57.5px cho cân giữa, vì icon ứng dụng phải vuông. Đường path và
  mã màu (#7CB9E8 sky-400, #4A90D9 ocean-500, #1B365D navy-700) giữ NGUYÊN VĂN.

  Bộ icon .png/.icns/.ico trong thư mục này sinh từ file này bằng:
      rsvg-convert -w 1024 -h 1024 konek-icon-source.svg -o /tmp/konek-icon.png
      pnpm tauri icon /tmp/konek-icon.png
  Sinh lại khi brand asset đổi — đừng sửa tay file nhị phân.
-->
