name: CI

# Hai câu hỏi khác nhau, hai mức chi phí khác nhau:
#
#   PR vào master  → "thay đổi này có làm hỏng gì không?"  → phải NHANH, chạy mọi lần
#   Merge vào master → "bản dựng còn đóng gói và chạy được trên máy khách không?"
#                      → được phép CHẬM, chạy mỗi lần merge
#
# Nguyên tắc cắt trùng lặp:
#   1. Kiểm tra KHÔNG phụ thuộc HĐH (ruff, mypy, import-linter, eslint, tsc, vite)
#      chạy ĐÚNG MỘT LẦN trên Linux. Chạy chúng ba lần cho ba HĐH không phát hiện
#      thêm gì — nó chỉ nhân ba thời gian chờ.
#   2. Kiểm tra CÓ phụ thuộc HĐH (pytest: mã hóa ký tự, đường dẫn, locale) chạy
#      trên nền tảng đích thật. Windows là nền tảng khách hàng chính (LD-02) nên
#      nằm trong cổng PR; macOS là máy của đội phát triển nên để lại lúc merge.
#   3. `tauri build` tự chạy `pnpm build` (xem `beforeBuildCommand`), nên job
#      `client` và job đóng gói KHÔNG cùng chạy trên một PR — nếu không, cùng một
#      bundle web bị dựng lại tới năm lần cho mỗi lần chạy. Hệ quả phải nhớ:
#      mọi cổng phía client (eslint, vitest) phải có mặt ở CẢ HAI job, vì PR nào
#      đụng `client/src-tauri/**` sẽ chỉ chạy job đóng gói — và PR phát hành thì
#      luôn đụng, do phiên bản nằm trong `Cargo.toml` + `tauri.conf.json`.
#   4. Job chỉ chạy khi vùng mã tương ứng có thay đổi. PR chỉ sửa tài liệu hoặc
#      chỉ sửa server thì không đụng tới toolchain Rust.
#
# Cổng bắt buộc cho branch protection là **một** job: `CI`. Nó tổng hợp kết quả
# nên các job con được phép bỏ qua mà không chặn PR.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Bắt trôi phụ thuộc: crate, SDK, image runner cập nhật có thể làm hỏng bản
  # dựng dù mã của ta không đổi dòng nào. Rẻ hơn nhiều so với dựng lại mọi lần
  # merge, mà vẫn phát hiện trong vòng một tuần. 03:00 thứ Hai giờ Việt Nam.
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # ---------------------------------------------------------------------------
  # Xác định vùng nào thay đổi. ~15 giây, nhưng cắt được cả một job Rust vài phút.
  # ---------------------------------------------------------------------------
  changes:
    name: Phạm vi thay đổi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Năm tệp khai phiên bản phải khớp nhau. Kiểm ở đây vì job này chạy trên
      # MỌI thay đổi, kể cả PR chỉ đụng tài liệu: một PR sửa `tauri.conf.json`
      # mà quên `pyproject.toml` sẽ khiến `release.yml` phát hành bộ cài mang số
      # khác với số mà `/health` báo. Rẻ (~1 giây) và bắt đúng lúc còn sửa được.
      - name: Phiên bản nhất quán giữa server và client
        run: python3 .github/scripts/check_version_consistency.py

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # `workflow_dispatch`, nhánh mới, hoặc lịch sử bị cắt → không so sánh
          # được thì chạy TẤT CẢ. Thà chạy thừa còn hơn bỏ sót một cổng.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="__ALL__"
          else
            changed=$(git diff --name-only "$(git merge-base "$base" "$head")" "$head")
          fi

          echo "Tệp thay đổi:"
          echo "$changed"

          has() { [ "$changed" = "__ALL__" ] || echo "$changed" | grep -Eq "$1"; }

          server=false; client=false; rust=false
          has '^server/'            && server=true
          has '^client/'            && client=true
          has '^client/src-tauri/'  && rust=true
          # Đổi chính CI hoặc Makefile thì kiểm lại mọi thứ — đó là lúc dễ tự
          # tay làm hỏng cổng chất lượng nhất.
          # `scripts/` cũng vào đây: `check_test_shards.py` (cổng đếm bài của
          # job chia shard) và `check-client-bundle.sh` là cổng CI thật — sửa
          # chúng mà không chạy job nào thì cổng không bao giờ được thử.
          if has '^\.github/(workflows|scripts)/' || has '^Makefile$'; then
            server=true; client=true; rust=true
          fi

          {
            echo "server=$server"
            echo "client=$client"
            echo "rust=$rust"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Kiểm tra tĩnh phía server — không phụ thuộc HĐH nên chạy đúng một lần.
  # ---------------------------------------------------------------------------
  server-quality:
    name: server · kiểu & luật phụ thuộc
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc
        run: uv sync --python ${{ env.PYTHON_VERSION }}

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      # Luật phụ thuộc là thuộc tính của đồ thị import, giống hệt trên mọi HĐH.
      # (Ghi chú lịch sử: import-linter từng chết trên Windows vì đọc file .ini
      # bằng locale cp1252 — nay không còn chạy ở đó nữa nên vấn đề tự hết.)
      - name: import-linter (ADR-004)
        run: uv run lint-imports --config importlinter.ini

      # mypy strict là hàng rào duy nhất bù cho việc Python không kiểm kiểu lúc
      # biên dịch (ADR-015). Đếm mỗi lần chạy để thấy nó trôi dần, thay vì phát
      # hiện sau sáu tháng. Nới ngưỡng phải sửa file này trong PR — đó chính là
      # điểm kiểm soát ta muốn.
      #
      # `grep` trả exit 1 khi KHÔNG tìm thấy gì — tức đúng lúc repo sạch nhất —
      # nên phải chặn exit đó, nếu không cổng bị lật ngược.
      - name: "Đếm `# type: ignore` (ngưỡng ADR-015)"
        shell: bash
        env:
          MAX_TYPE_IGNORE: 0
        run: |
          count=$(grep -rn "type: ignore" src/ | wc -l | tr -d ' ') || count=0
          echo "\`# type: ignore\`: $count / ngưỡng $MAX_TYPE_IGNORE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt "$MAX_TYPE_IGNORE" ]; then
            echo "::error::Vượt ngưỡng \`# type: ignore\` ($count > $MAX_TYPE_IGNORE) — xem ADR-015"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Test server KHÔNG cần DB — chạy trên nền tảng đích thật.
  # PR: Linux + Windows (Windows là nền tảng khách hàng chính, LD-02).
  # Merge: thêm macOS. Đội phát triển chạy macOS hằng ngày nên nó là nền tảng
  # ít rủi ro nhất; để lại lúc merge thay vì bắt mọi PR chờ.
  # ---------------------------------------------------------------------------
  server-tests:
    name: server · test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request'
              && '["ubuntu-latest","windows-latest"]'
              || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc
        run: uv sync --python ${{ env.PYTHON_VERSION }}

      # WeasyPrint gọi Pango/GObject qua DLL hệ thống — runner Windows không có
      # sẵn (Linux/macOS thì có). Cài bằng MSYS2 (có sẵn tại C:\msys64) theo
      # đúng hướng dẫn Windows của WeasyPrint, rồi trỏ nó tới thư mục DLL qua
      # WEASYPRINT_DLL_DIRECTORIES. Thiếu bước này mọi test render PDF chết
      # ngay lúc import với "cannot load library 'libgobject-2.0-0'".
      - name: Cài Pango cho WeasyPrint (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-pango
          "WEASYPRINT_DLL_DIRECTORIES=C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Cùng lý do cho macOS (chỉ chạy lúc merge): runner không có sẵn Pango,
      # máy dev thì có qua Homebrew nên khác biệt này chỉ lộ ra trên CI.
      #
      # Cài THÔI chưa đủ: Homebrew trên máy Apple Silicon đặt thư viện ở
      # `/opt/homebrew/lib`, không nằm trong danh sách dyld tìm mặc định
      # (`$HOME/lib:/usr/local/lib:/lib:/usr/lib`). Máy dev tìm ra là nhờ cấu
      # hình sẵn có của người dùng, nên khác biệt này chỉ lộ trên runner sạch —
      # và vì job macOS chỉ chạy lúc MERGE, nó lộ sau khi PR đã xanh.
      # `DYLD_FALLBACK_LIBRARY_PATH` sống qua `uv run` vì python của uv không
      # phải nhị phân hệ thống (SIP chỉ tước biến `DYLD_*` cho nhị phân đó).
      - name: Cài Pango cho WeasyPrint (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango
          brew_lib="$(brew --prefix)/lib"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$brew_lib" >> "$GITHUB_ENV"
          # In ra để lần sau lỗi thì biết ngay là thiếu thư viện hay sai đường dẫn.
          echo "kiến trúc: $(uname -m) · thư viện tại: $brew_lib"
          ls -1 "$brew_lib"/libgobject-2.0*.dylib || echo "KHÔNG THẤY libgobject!"

      # Nhóm `db` có job riêng (cần service container, chỉ chạy trên Linux).
      # Loại trừ tường minh chứ không để nó tự bỏ qua: một bộ test "xanh vì
      # không kết nối được DB" là tín hiệu tệ hơn không có tín hiệu.
      - name: pytest (không cần DB)
        run: uv run pytest -m "not db"

  # ---------------------------------------------------------------------------
  # Cổng bảo mật dữ liệu: RLS cô lập chi nhánh (RT-04), nhật ký bất biến bằng
  # tách quyền sở hữu (RT-02), cô lập schema-per-dataset (RT-17). Không mô phỏng
  # được — chúng là hành vi của PostgreSQL, nên job này chạy DB thật.
  # ---------------------------------------------------------------------------
  server-db:
    name: server · test có PostgreSQL (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    # 30 chứ không 20: trần này canh cho một shard TREO, không cho một shard
    # chậm. Trước khi chia shard, một lượt khỏe của cả bộ đo được 17m22s trên
    # runner GH; nay mỗi shard chỉ chạy khoảng một phần ba số bài, nên 30 phút
    # là dư địa rất rộng — và đó là chủ ý. Lượt 33658137670 chết ở đúng trần
    # này vì `pg_advisory_xact_lock` chờ vô hạn, không vì test chậm; hạ trần
    # xuống sát thời gian chạy thật sẽ biến mọi runner chậm thành đỏ giả mà
    # không bắt sớm hơn được ca treo. Hai cơ chế khác canh chiều ấy:
    # `faulthandler_timeout=300` (pyproject) in stack trace của khung đang treo,
    # và `lock_timeout` phạm vi database (`tests/lock_diagnostics.py`) làm lần
    # chờ khóa hỏng trong 60 giây kèm danh sách phiên đang chặn.
    timeout-minutes: 30
    strategy:
      # Một shard đỏ không được hủy hai shard kia: khi bộ test hỏng, biết nó
      # hỏng ở ĐÂU quan trọng hơn tiết kiệm vài phút runner.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        # Ghim phiên bản: hành vi RLS/quyền phải giống bản khách hàng chạy.
        # Mỗi shard có service container RIÊNG — đó là toàn bộ lý do chọn chia
        # shard thay vì `pytest-xdist`: `conftest` xóa/dựng lại vai trò ở phạm
        # vi CỤM và dùng dataset phạm vi phiên dùng chung, nên hai worker trong
        # một tiến trình sẽ giẫm lên nhau. Ba tiến trình, ba cụm thì không.
        image: postgres:16
        env:
          # Bộ test tự tạo `ket_owner`/`ket_app` **không mật khẩu** (bản cài
          # thật đặt mật khẩu từ OS keystore — ADR-019). Dùng đúng công tắc mà
          # image hỗ trợ, thay vì sửa `pg_hba.conf` qua `docker exec`:
          # `pg_ctl reload` khi đó chạy dưới root và PostgreSQL từ chối.
          #
          # `trust` chỉ áp cho container CI dùng một lần. Bản cài khách hàng đi
          # đường ngược lại: `scram-sha-256` + `pg_hba` cứng (RT-06, phase 11).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Không có DB thì job này phải ĐỎ, không được "xanh vì bỏ qua".
      KET_TEST_REQUIRE_DB: "1"
      # Nhóm `db` xóa/dựng lại vai trò ở phạm vi cụm — an toàn ở đây vì service
      # container dùng một lần, nhưng phải khẳng định tường minh (xem
      # `tests/conftest.py::_drop_ket_roles`).
      KET_TEST_DESTRUCTIVE_CLUSTER: "1"
      KET_TEST_ADMIN_DSN: postgresql+psycopg://postgres@localhost:5432/postgres
      KET_TEST_KET_OWNER_DSN: postgresql+psycopg://ket_owner@localhost:5432/ket_test
      KET_TEST_KET_APP_DSN: postgresql+psycopg://ket_app@localhost:5432/ket_test
      # Vai trò của tiến trình chạy tác vụ nền (lát 2B-2b): quyền của nó dừng ở
      # đúng bảng `jobs`, nên test hàng đợi phải đăng nhập bằng chính nó — dùng
      # `ket_app` sẽ xanh trong khi worker thật không giành nổi một job nào.
      KET_TEST_KET_WORKER_DSN: postgresql+psycopg://ket_worker@localhost:5432/ket_test

      # Mỗi shard ghi dữ liệu độ phủ vào tệp riêng; job `server-db-coverage`
      # gộp lại. Không đặt biến này thì cả ba shard cùng ghi `.coverage` và
      # con số cuối chỉ phản ánh shard nào tải lên sau cùng.
      COVERAGE_FILE: .coverage.shard${{ matrix.shard }}

      # ---------------------------------------------------------------------
      # Cách chia, và vì sao chia như vậy.
      #
      # Chia theo TỆP, không theo bài: bốn tệp có fixture actor phạm vi module
      # (xem `docs/codebase-summary.md` §5) chỉ rẻ khi cả tệp chạy trong một
      # tiến trình — cắt giữa tệp là dựng lại người dùng "phạm vi toàn công ty"
      # thêm một lần, đúng thứ ba lát trước vừa bỏ công cắt đi.
      #
      # Chia theo THỜI LƯỢNG ĐO ĐƯỢC, không theo số tệp. Đo trên lượt chạy đầy
      # đủ (`--durations=0`, 578,8s bài / 127 tệp) rồi mô phỏng từng cơ chế:
      #
      #     vòng tròn alphabet   → shard chậm nhất lệch 47,9%
      #     băm crc32 tên tệp    → lệch 61,4%
      #     theo thời lượng (17 tệp nặng nhất) → lệch 1,3%
      #
      # Chia "không cần biết thời lượng" hỏng vì shard CHẬM NHẤT quyết định
      # wall-clock: lệch 48% ăn mất gần nửa phần lợi của việc song song.
      #
      # Chỉ liệt kê 17 tệp nặng nhất chứ không cả 127: liệt kê hết cho cân bằng
      # hoàn hảo trên giấy nhưng đổi lại 127 dòng YAML phải sửa tay mỗi lần thêm
      # tệp test. Shard 3 nhận phần còn lại bằng `--ignore`, nên **tệp test mới
      # tự động có chỗ chạy** — không ai phải nhớ cập nhật danh sách này.
      #
      # ĐỪNG TIN CÁC CON SỐ CÂN BẰNG TRÊN. Diễn tập cục bộ ba shard cho:
      #
      #     shard 1: dự đoán 189,0s → THỰC 96,6s
      #     shard 2: dự đoán 195,5s → THỰC 114,2s
      #     shard 3: dự đoán 194,3s → THỰC 209,4s
      #     tổng:    578,8s        → THỰC 420,2s  (nhanh hơn 171s)
      #
      # Dự đoán trượt vì đúng cơ chế mà cả loạt lát này đi sửa: chi phí fixture
      # "phạm vi toàn công ty" là O(số chi nhánh TÍCH LŨY trong phiên). Thời
      # lượng dùng để chia được đo TRONG lượt đầy đủ, nơi các tệp nặng đã bị
      # tích lũy thổi phồng; tách ra shard riêng thì chúng rẻ hẳn. Nói cách
      # khác: **thời lượng dùng để chia lại là hàm của cách chia**. Một lượt
      # `--durations=0` trên bộ đầy đủ KHÔNG dự đoán được thời gian shard.
      #
      # Lệch hiện tại (96,6 / 114,2 / 209,4) là ~54% và **được chấp nhận có ý
      # thức**: shard chậm nhất ước ~4:20 trên CI, còn mục tiêu là 10 phút. Cân
      # lại chỉ khi shard chậm nhất chạm ~7 phút thật, và khi đó phải đo bằng
      # một lượt chia shard THẬT — không phải bằng `--durations=0` của lượt
      # không chia, vì con số đó đã sai một lần rồi.
      # ---------------------------------------------------------------------
      SHARD_1_FILES: >-
        tests/test_gl_journal_api.py
        tests/test_import_api.py
        tests/test_master_data_api.py
        tests/test_master_data_merge.py
        tests/test_period_lock_and_pending_issues_api.py
        tests/test_report_books_and_printing.py
        tests/test_report_logo_upload.py
        tests/test_voucher_print_api.py
      SHARD_2_FILES: >-
        tests/test_attachments_api.py
        tests/test_cash_bank_book_reports.py
        tests/test_config_packages_api.py
        tests/test_import_template.py
        tests/test_item_catalog_api.py
        tests/test_opening_balances_api.py
        tests/test_partner_catalog_api.py
        tests/test_reports_api.py
        tests/test_worker_runner.py

    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc
        run: uv sync --python ${{ env.PYTHON_VERSION }}

      # Chạy TOÀN BỘ bộ test qua ba shard, không chỉ nhóm `db`, để con số độ phủ
      # có nghĩa: phần lớn `kernel/security` và `kernel/datasets` chỉ chạy được
      # khi có PostgreSQL, nên đo riêng nhóm không-DB sẽ cho ra một con số thấp
      # giả. Nhóm không-DB vẫn chạy riêng ở job `server-tests` — ở đó câu hỏi
      # khác: "còn chạy đúng trên Windows/macOS không".
      #
      # `--cov-report=` (rỗng): báo cáo từng shard là báo cáo trên MỘT PHẦN ba
      # bộ test, in nó ra chỉ mời người đọc tin một con số sai. Con số thật do
      # `server-db-coverage` in sau khi gộp.
      - name: pytest shard ${{ matrix.shard }}/3 + thu dữ liệu độ phủ
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            1) select=( $SHARD_1_FILES ) ;;
            2) select=( $SHARD_2_FILES ) ;;
            # Shard bắt-hết. Danh sách `--ignore` dựng TỪ CHÍNH hai biến trên,
            # không chép lại: hai danh sách chép tay lệch nhau là cách duy nhất
            # để một tệp không chạy ở shard nào mà CI vẫn xanh.
            3) select=()
               for f in $SHARD_1_FILES $SHARD_2_FILES; do select+=( "--ignore=$f" ); done ;;
            *) echo "::error::shard không hợp lệ: ${{ matrix.shard }}"; exit 1 ;;
          esac
          # Mảng rỗng thì `"${select[@]}"` biến mất khỏi dòng lệnh và pytest rơi
          # về `testpaths = ["tests"]` — shard ấy lặng lẽ chạy CẢ 1.917 bài, gần
          # chạm trần 30 phút. Cổng đếm bài bắt được, nhưng chỉ sau khi ba lượt
          # chạy đã tốn xong.
          if [ ${#select[@]} -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} không chọn được tệp nào — kiểm SHARD_*_FILES"
            exit 1
          fi
          uv run pytest --cov --cov-report= \
            --junitxml="junit-shard${{ matrix.shard }}.xml" "${select[@]}"

      # `if: always()`: shard đỏ thì junit XML của nó là thứ đáng đọc nhất, và
      # cổng đếm bài ở job sau cần đủ ba tệp mới kết luận được.
      #
      # `include-hidden-files`: `.coverage.shard*` bắt đầu bằng dấu chấm, mà
      # upload-artifact v4 bỏ tệp ẩn theo mặc định — thiếu cờ này thì độ phủ
      # gộp lại im lặng bằng 0 và không có lỗi nào được in ra.
      - name: Tải kết quả shard lên
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-db-shard-${{ matrix.shard }}
          path: |
            server/.coverage.shard${{ matrix.shard }}
            server/junit-shard${{ matrix.shard }}.xml
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Gộp kết quả ba shard: một con số độ phủ, một bình luận PR, một cổng đếm bài.
  #
  # Tách khỏi `server-db` vì hai việc ở đây chỉ làm được khi **cả ba** shard đã
  # xong. Cổng đếm bài là lý do quan trọng hơn: chia shard có đúng một kiểu hỏng
  # nghiêm trọng và im lặng — một tệp không thuộc shard nào — và không shard nào
  # tự phát hiện được điều đó.
  #
  # Đây cũng là job DUY NHẤT được ghi vào PR. Ba shard chạy song song không cần
  # quyền ghi, nên chúng không có.
  # ---------------------------------------------------------------------------
  server-db-coverage:
    name: server · gộp độ phủ + cổng đếm bài
    needs: [changes, server-db]
    # KHÔNG `always()`. Job này chỉ có nghĩa khi cả ba shard chạy trọn: gộp độ
    # phủ từ hai trong ba shard cho ra một con số thấp hơn sự thật, và bước dán
    # bình luận PR sửa TẠI CHỖ — nó sẽ ghi đè con số đúng của lần push trước
    # bằng con số sai, ngay trên thứ mà người review đọc. Trước khi chia shard,
    # `always()` an toàn vì một lượt hỏng vẫn cho dữ liệu độ phủ đầy đủ; chia
    # shard làm giả định đó hết đúng.
    #
    # Bỏ `always()` cũng gỡ luôn hai vấn đề khác: job không còn chạy (và hỏng ở
    # bước tải artifact) khi lượt CI bị `cancel-in-progress` hủy, và
    # `$COVERAGE_TOTAL` không còn có đường trở thành biến chưa gán dưới `set -u`.
    #
    # Không mất cổng nào: shard đỏ ⇒ `server-db` đỏ ⇒ `ci-ok` đỏ. `ci-ok` chỉ
    # tha cho `skipped`, mà job này chỉ `skipped` khi `server-db` cũng `skipped`.
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc
        run: uv sync --python ${{ env.PYTHON_VERSION }}

      - name: Tải kết quả các shard về
        uses: actions/download-artifact@v4
        with:
          pattern: server-db-shard-*
          merge-multiple: true
          path: server

      - name: Cổng đếm bài — các shard cộng lại phải bằng bộ đầy đủ
        shell: bash
        run: |
          set -euo pipefail
          # Không neo `^`: dòng tổng chỉ nằm ở đầu dòng nhờ `-q` trong `addopts`
          # của pyproject. Ai đó thêm `-v` thì nó thành
          # `====== 1917 tests collected ======`, và một cổng neo `^` sẽ hỏng
          # bằng một pipeline rỗng — trỏ nhầm vào ci.yml thay vì vào chỗ thật sự
          # đổi. Bắt cụm `<số> tests collected` ở bất kỳ đâu trên dòng rồi mới
          # tách số. (`tests?` cho cả dạng số ít của pytest.)
          #
          # `|| true` để `set -e` không nuốt mất thông điệp bên dưới: pytest thu
          # thập hỏng (lỗi import chẳng hạn) cũng rơi vào đúng nhánh này.
          expected=$(uv run pytest --collect-only -p no:warnings \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' | tail -1) || true
          if [ -z "$expected" ]; then
            echo "::error::Không đọc được số bài từ \`pytest --collect-only\` — nhiều khả năng bước thu thập chính nó đã hỏng."
            exit 1
          fi
          echo "pytest thu thập trên toàn bộ: $expected bài"
          python3 ../.github/scripts/check_test_shards.py \
            --expected "$expected" junit-shard1.xml junit-shard2.xml junit-shard3.xml

      - name: Gộp độ phủ ba shard
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          data=( .coverage.shard* )
          if [ ${#data[@]} -eq 0 ]; then
            echo "::error::Không shard nào để lại dữ liệu độ phủ."
            exit 1
          fi
          echo "Gộp: ${data[*]}"
          uv run coverage combine "${data[@]}"
          total=$(uv run coverage report --format=total)
          {
            echo "## Độ phủ test: **${total}%**"
            echo
            echo "Đo trên \`server/src/ket\`, gộp từ ${#data[@]} shard của toàn bộ bộ test"
            echo "(gồm nhóm cần PostgreSQL). Tệp phủ 100% được ẩn cho gọn."
            echo
            uv run coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"
          echo "COVERAGE_TOTAL=$total" >> "$GITHUB_ENV"

      # Dán vào PR dưới dạng **một** bình luận được cập nhật tại chỗ, không phải
      # một bình luận mới mỗi lần push — mốc HTML ẩn ở đầu thân bình luận là thứ
      # để tìm lại nó. Dùng `gh api` thay vì action bên thứ ba: ít một mắt xích
      # trong chuỗi cung ứng cho một việc chỉ có hai lệnh gọi.
      - name: Dán độ phủ vào PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- ket-coverage -->'
          {
            echo "$marker"
            echo "### Độ phủ test: **${COVERAGE_TOTAL}%**"
            echo
            echo "<details><summary>Chi tiết theo tệp (ẩn tệp phủ 100%)</summary>"
            echo
            uv run coverage report --format=markdown --skip-covered
            echo
            echo "</details>"
            echo
            echo "_Đo trên \`server/src/ket\`, gộp từ ba shard của toàn bộ bộ test. Cập nhật ở mỗi lần push._"
          } > /tmp/coverage-comment.md

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id] | first // empty")

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@/tmp/coverage-comment.md >/dev/null
            echo "Đã cập nhật bình luận $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" \
              -F body=@/tmp/coverage-comment.md >/dev/null
            echo "Đã tạo bình luận độ phủ"
          fi

  # ---------------------------------------------------------------------------
  # Web UI. Bundle web không phụ thuộc HĐH → một lần trên Linux là đủ.
  #
  # Chỉ chạy trên PR, và chỉ khi job đóng gói desktop KHÔNG chạy: `tauri build`
  # gọi `pnpm build` (`tsc --noEmit && vite build`) nên nó đã bao trọn phần việc
  # này. Hai job cùng chạy = dựng lại y hệt một bundle hai lần.
  # ---------------------------------------------------------------------------
  client:
    name: client · kiểu, lint, test, build
    needs: changes
    # `rust != 'true'` tạm gỡ khỏi điều kiện trong lúc `desktop-bundle` bị tắt
    # (xem ghi chú ở job đó): job kia là nơi PR đụng `src-tauri` được kiểm, nên
    # để nguyên loại trừ này sẽ tạo ra một khoảng mù đúng ở những PR đó.
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

      - name: eslint
        run: pnpm exec eslint .

      # Máy trạng thái đăng nhập có bốn nhánh mà `tsc` không thấy được
      # (mã 2FA, mật khẩu tạm, phiên hạn chế, client quá cũ) — quyết định H3.
      - name: vitest
        run: pnpm exec vitest run

      - name: vite build
        run: pnpm exec vite build

      # Cổng duy nhất chứng minh được bất biến "bundle giao khách không chứa
      # công cụ dev". Test đơn vị ép cờ rồi khẳng định nhánh — nó vẫn xanh trong
      # khi bản dựng THẬT đặt cờ sai, và đã từng đúng như vậy: hồi cổng còn treo
      # trên `import.meta.env.DEV`, một bản dựng với `NODE_ENV=development` cho
      # ra bundle có route `/kitchen-sink` (đường vào không qua `SessionGate`)
      # kèm sourcemap toàn bộ mã nguồn client. Script dựng thử trong chính môi
      # trường đó rồi grep sản phẩm.
      - name: Bundle không chứa công cụ dev
        working-directory: .
        run: ./.github/scripts/check-client-bundle.sh

  # ---------------------------------------------------------------------------
  # Hiệu năng lưới nhập liệu (spike S3, phase 2 bước 17).
  #
  # Job riêng chứ không nhét vào job `client`: nó cần tải Chromium (~95MB) và
  # chạy một máy chủ dev, nên nó chậm hơn hẳn phần còn lại; và nó phải chạy CẢ
  # KHI PR đụng `src-tauri/**` (lúc đó job `client` tự tắt để nhường cho job
  # đóng gói, mà job đóng gói thì không đo gì).
  #
  # Vì sao canh hiệu năng bằng CI thay vì đo một lần rồi ghi vào báo cáo: kết
  # luận của spike S3 chỉ đúng chừng nào ba quyết định H11/H12/H15 còn nguyên.
  # Chúng là những thứ một lần refactor thiện chí sẽ gỡ mất ("sao ô nhập lại
  # không controlled?"), và triệu chứng — gõ hơi khựng — không ai nhìn thấy
  # trong diff. Đo được: gỡ cuộn ảo ra thì p95 nhảy từ 16,4ms lên 69,7ms.
  # ---------------------------------------------------------------------------
  client-bench:
    name: client · hiệu năng lưới nhập liệu (spike S3)
    needs: changes
    # Không giới hạn ở `pull_request` như job `client`: ở đó job đóng gói desktop
    # bao trọn phần việc khi merge, còn ở đây **không job nào khác đo hiệu năng**.
    # Lượt chạy định kỳ cũng cần: Chromium và Playwright tự cập nhật là đúng loại
    # trôi mà một bộ đo phải bắt, dù mã của ta không đổi dòng nào.
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: Cài Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Ngưỡng nằm trong chính bài đo (p95 < 50ms mỗi phím, dán 200 dòng < 1s).
      # Số đo từng lượt in ra log để so được giữa các PR.
      - name: Đo lưới nhập liệu
        run: pnpm exec playwright test

  # ---------------------------------------------------------------------------
  # Hợp đồng client↔server: type TypeScript phải là bản sinh từ mã server đang
  # có (bước 14 của phase 2). Job riêng vì nó cần **cả hai** toolchain — Python
  # để xuất OpenAPI, Node để sinh type — nên nó không thuộc về job `server-*`
  # hay job `client`.
  #
  # Chạy khi một trong hai bên đổi: đổi response model ở server hoặc sửa tay
  # thư mục `packages/api-types` đều làm hợp đồng lệch.
  # ---------------------------------------------------------------------------
  api-types:
    name: hợp đồng · type sinh từ OpenAPI
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Đồng bộ phụ thuộc
        run: |
          cd server && uv sync --python ${{ env.PYTHON_VERSION }}
          cd ../client && pnpm install --frozen-lockfile

      # Sinh lại rồi so với bản đã commit. Đỏ = đã đổi hợp đồng API mà quên
      # chạy `make api-types`; diff in ra chỉ đúng chỗ đổi.
      - name: Type sinh từ OpenAPI đã được cập nhật chưa
        run: make api-types-check

  # ---------------------------------------------------------------------------
  # Đóng gói desktop — job đắt nhất (biên dịch Rust + dựng installer, và runner
  # macOS tính giá gấp 10 lần Linux). Chỉ chạy khi kết quả có thể khác lần trước:
  #   * PR có đụng `client/src-tauri/**` — đổi shell thì phải biết còn đóng gói được
  #   * merge vào master có đụng `client/**` — cổng phát hành thật
  #   * chạy định kỳ hằng tuần — bắt trôi phụ thuộc (crate/SDK cập nhật làm hỏng
  #     bản dựng dù mã của ta không đổi dòng nào)
  #
  # Merge chỉ đụng server thì KHÔNG dựng lại: bản đóng gói desktop không phụ
  # thuộc mã server, kết quả sẽ y hệt lần trước.
  # Chỉ dựng cho hai nền tảng của v1 (LD-02) — Ubuntu không nằm trong phạm vi.
  # ---------------------------------------------------------------------------
  desktop-bundle:
    name: desktop · đóng gói (${{ matrix.os }})
    needs: changes
    # TẠM TẮT (2026-08-17, quyết định của chủ dự án): job này chiếm phần lớn phút
    # GitHub Actions của kho — hai runner tính phí (Windows ×2, macOS ×10) tới 45
    # phút mỗi nền tảng — trong khi bộ cài desktop chưa tới tay ai. `ci-ok` coi
    # job bị bỏ qua là chấp nhận được nên cổng bắt buộc vẫn xanh.
    #
    # Hai job bù lại khoảng mù trong lúc job này tắt:
    #
    # * `client` được nới điều kiện (bỏ loại trừ `rust != 'true'`) nên PR đụng
    #   `src-tauri` vẫn qua cổng kiểu/lint/test phía web;
    # * `rust-quality` chạy `cargo fmt`/`cargo clippy` trên Ubuntu — job này vốn
    #   là nơi duy nhất chạy chúng.
    #
    # Cái **không** bù được: bản dựng thật cho Windows/macOS. Đường đó chỉ được
    # kiểm lại khi bật lại job này.
    #
    # MỞ LẠI: xóa dòng `false &&` dưới đây, và khôi phục `rust != 'true'` trong
    # `if:` của job `client`. Giữ `rust-quality` — nó cho phản hồi trong vài phút
    # thay vì chờ hết lượt đóng gói.
    if: >-
      false &&
      (needs.changes.outputs.rust == 'true'
      || (github.event_name != 'pull_request' && needs.changes.outputs.client == 'true'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm exec eslint .

      # Job này và job `client` loại trừ nhau (xem ghi chú đầu tệp), nên bộ test
      # client phải có mặt ở CẢ HAI — nếu không, đúng những PR đụng `src-tauri`
      # sẽ bỏ qua nó. Mà PR phát hành thì **luôn** đụng: phiên bản nằm trong
      # `Cargo.toml` và `tauri.conf.json`.
      #
      # Chạy trên cả macOS lẫn Windows là phần thêm chứ không phải phần thừa:
      # bộ test này chạm `Intl` và `localStorage` của jsdom, hai thứ có tiền lệ
      # khác nhau giữa các nền tảng.
      - name: vitest
        run: pnpm exec vitest run

      # Cùng lý do như bộ test: job này và job `client` loại trừ nhau, nên cổng
      # "bundle giao khách không chứa công cụ dev" phải có mặt ở cả hai — mà PR
      # phát hành thì LUÔN đi đường này. `shell: bash` để chạy được cả trên
      # runner Windows (Git Bash có sẵn).
      - name: Bundle không chứa công cụ dev
        shell: bash
        working-directory: .
        run: ./.github/scripts/check-client-bundle.sh

      - name: cargo fmt --check
        working-directory: client/src-tauri
        run: cargo fmt --check

      - name: cargo clippy (warning = lỗi)
        working-directory: client/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Bao luôn `tsc --noEmit` + `vite build` qua `beforeBuildCommand`.
      #
      # Cần khóa ký updater y như `release.yml`: từ khi `tauri.conf.json` bật
      # `createUpdaterArtifacts`, **mọi** `tauri build` đều sinh gói cập nhật và
      # đổ nếu thiếu khóa ("A public key has been found, but no private key").
      # Truyền secret ở đây không phải để phát hành — job này không tải gì lên —
      # mà để nó dựng đúng **cùng một đường** với bản phát hành thật. Một job
      # đóng gói chạy đường khác với đường phát hành thì nó canh nhầm thứ.
      - name: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build

  # ---------------------------------------------------------------------------
  # Cổng Rust tách khỏi job đóng gói.
  #
  # Tồn tại vì `desktop-bundle` đang tắt (xem ghi chú ở job đó) mà nó lại là nơi
  # DUY NHẤT chạy `cargo fmt`/`cargo clippy` — tắt đi thì `client/src-tauri`
  # không còn cổng nào, và `ci-ok` coi job bị bỏ qua là đạt nên không ai thấy.
  #
  # Chạy trên Ubuntu: hai lệnh này không phụ thuộc hệ điều hành, và runner Linux
  # tính phút 1x thay vì 2x (Windows) hoặc 10x (macOS). Cái **không** kiểm được ở
  # đây là bản dựng thật cho Windows/macOS — đó vẫn là việc của `desktop-bundle`
  # khi bật lại. Giữ job này khi ấy cũng không thừa: nó cho phản hồi trong vài
  # phút thay vì chờ hết lượt đóng gói.
  # ---------------------------------------------------------------------------
  rust-quality:
    name: rust · fmt & clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      # Phụ thuộc hệ thống của Tauri trên Linux. Cần cả cho `clippy` chứ không
      # chỉ cho `build`: crate `tauri` liên kết tới webkit2gtk qua `pkg-config`
      # ngay ở bước phân giải, nên thiếu chúng thì clippy đổ ở lỗi liên kết chứ
      # không phải ở lỗi mã nguồn.
      - name: Phụ thuộc hệ thống của Tauri
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (warning = lỗi)
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Cổng duy nhất để đặt vào branch protection.
  #
  # Job con dùng `if:` nên có thể bị BỎ QUA; đặt từng job làm required check sẽ
  # chặn PR không đụng tới vùng đó. Job này tổng hợp: bỏ qua = chấp nhận, đỏ =
  # chặn. Thêm job mới thì thêm vào `needs` — quên thì nó không được canh.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI
    if: always()
    needs:
      [
        changes,
        server-quality,
        server-tests,
        server-db,
        server-db-coverage,
        client,
        client-bench,
        api-types,
        rust-quality,
        desktop-bundle,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tổng hợp kết quả
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > results.json
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' results.json | sort | tee -a "$GITHUB_STEP_SUMMARY"

          failed=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key' results.json)

          if [ -n "$failed" ]; then
            echo "::error::Job không đạt: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "Tất cả cổng đã đạt (hoặc được bỏ qua vì không liên quan)."
