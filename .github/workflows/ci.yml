name: CI

# Hai câu hỏi khác nhau, hai mức chi phí khác nhau:
#
#   PR vào master  → "thay đổi này có làm hỏng gì không?"  → phải NHANH, chạy mọi lần
#   Merge vào master → "bản dựng còn đóng gói và chạy được trên máy khách không?"
#                      → được phép CHẬM, chạy mỗi lần merge
#
# Nguyên tắc cắt trùng lặp:
#   1. Kiểm tra KHÔNG phụ thuộc HĐH (ruff, mypy, import-linter, eslint, tsc, vite)
#      chạy ĐÚNG MỘT LẦN trên Linux. Chạy chúng ba lần cho ba HĐH không phát hiện
#      thêm gì — nó chỉ nhân ba thời gian chờ.
#   2. Kiểm tra CÓ phụ thuộc HĐH (pytest: mã hóa ký tự, đường dẫn, locale) chạy
#      trên nền tảng đích thật. Windows là nền tảng khách hàng chính (LD-02) nên
#      nằm trong cổng PR; macOS là máy của đội phát triển nên để lại lúc merge.
#   3. `tauri build` tự chạy `pnpm build` (xem `beforeBuildCommand`), nên job
#      `client` và job đóng gói KHÔNG cùng chạy trên một PR — nếu không, cùng một
#      bundle web bị dựng lại tới năm lần cho mỗi lần chạy.
#   4. Job chỉ chạy khi vùng mã tương ứng có thay đổi. PR chỉ sửa tài liệu hoặc
#      chỉ sửa server thì không đụng tới toolchain Rust.
#
# Cổng bắt buộc cho branch protection là **một** job: `CI`. Nó tổng hợp kết quả
# nên các job con được phép bỏ qua mà không chặn PR.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Bắt trôi phụ thuộc: crate, SDK, image runner cập nhật có thể làm hỏng bản
  # dựng dù mã của ta không đổi dòng nào. Rẻ hơn nhiều so với dựng lại mọi lần
  # merge, mà vẫn phát hiện trong vòng một tuần. 03:00 thứ Hai giờ Việt Nam.
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # ---------------------------------------------------------------------------
  # Xác định vùng nào thay đổi. ~15 giây, nhưng cắt được cả một job Rust vài phút.
  # ---------------------------------------------------------------------------
  changes:
    name: Phạm vi thay đổi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Năm tệp khai phiên bản phải khớp nhau. Kiểm ở đây vì job này chạy trên
      # MỌI thay đổi, kể cả PR chỉ đụng tài liệu: một PR sửa `tauri.conf.json`
      # mà quên `pyproject.toml` sẽ khiến `release.yml` phát hành bộ cài mang số
      # khác với số mà `/health` báo. Rẻ (~1 giây) và bắt đúng lúc còn sửa được.
      - name: Phiên bản nhất quán giữa server và client
        run: python3 .github/scripts/check_version_consistency.py

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # `workflow_dispatch`, nhánh mới, hoặc lịch sử bị cắt → không so sánh
          # được thì chạy TẤT CẢ. Thà chạy thừa còn hơn bỏ sót một cổng.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="__ALL__"
          else
            changed=$(git diff --name-only "$(git merge-base "$base" "$head")" "$head")
          fi

          echo "Tệp thay đổi:"
          echo "$changed"

          has() { [ "$changed" = "__ALL__" ] || echo "$changed" | grep -Eq "$1"; }

          server=false; client=false; rust=false
          has '^server/'            && server=true
          has '^client/'            && client=true
          has '^client/src-tauri/'  && rust=true
          # Đổi chính CI hoặc Makefile thì kiểm lại mọi thứ — đó là lúc dễ tự
          # tay làm hỏng cổng chất lượng nhất.
          if has '^\.github/workflows/' || has '^Makefile$'; then
            server=true; client=true; rust=true
          fi

          {
            echo "server=$server"
            echo "client=$client"
            echo "rust=$rust"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Kiểm tra tĩnh phía server — không phụ thuộc HĐH nên chạy đúng một lần.
  # ---------------------------------------------------------------------------
  server-quality:
    name: server · kiểu & luật phụ thuộc
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc
        run: uv sync --python ${{ env.PYTHON_VERSION }}

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      # Luật phụ thuộc là thuộc tính của đồ thị import, giống hệt trên mọi HĐH.
      # (Ghi chú lịch sử: import-linter từng chết trên Windows vì đọc file .ini
      # bằng locale cp1252 — nay không còn chạy ở đó nữa nên vấn đề tự hết.)
      - name: import-linter (ADR-004)
        run: uv run lint-imports --config importlinter.ini

      # mypy strict là hàng rào duy nhất bù cho việc Python không kiểm kiểu lúc
      # biên dịch (ADR-015). Đếm mỗi lần chạy để thấy nó trôi dần, thay vì phát
      # hiện sau sáu tháng. Nới ngưỡng phải sửa file này trong PR — đó chính là
      # điểm kiểm soát ta muốn.
      #
      # `grep` trả exit 1 khi KHÔNG tìm thấy gì — tức đúng lúc repo sạch nhất —
      # nên phải chặn exit đó, nếu không cổng bị lật ngược.
      - name: "Đếm `# type: ignore` (ngưỡng ADR-015)"
        shell: bash
        env:
          MAX_TYPE_IGNORE: 0
        run: |
          count=$(grep -rn "type: ignore" src/ | wc -l | tr -d ' ') || count=0
          echo "\`# type: ignore\`: $count / ngưỡng $MAX_TYPE_IGNORE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt "$MAX_TYPE_IGNORE" ]; then
            echo "::error::Vượt ngưỡng \`# type: ignore\` ($count > $MAX_TYPE_IGNORE) — xem ADR-015"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Test server KHÔNG cần DB — chạy trên nền tảng đích thật.
  # PR: Linux + Windows (Windows là nền tảng khách hàng chính, LD-02).
  # Merge: thêm macOS. Đội phát triển chạy macOS hằng ngày nên nó là nền tảng
  # ít rủi ro nhất; để lại lúc merge thay vì bắt mọi PR chờ.
  # ---------------------------------------------------------------------------
  server-tests:
    name: server · test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request'
              && '["ubuntu-latest","windows-latest"]'
              || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc
        run: uv sync --python ${{ env.PYTHON_VERSION }}

      # Nhóm `db` có job riêng (cần service container, chỉ chạy trên Linux).
      # Loại trừ tường minh chứ không để nó tự bỏ qua: một bộ test "xanh vì
      # không kết nối được DB" là tín hiệu tệ hơn không có tín hiệu.
      - name: pytest (không cần DB)
        run: uv run pytest -m "not db"

  # ---------------------------------------------------------------------------
  # Cổng bảo mật dữ liệu: RLS cô lập chi nhánh (RT-04), nhật ký bất biến bằng
  # tách quyền sở hữu (RT-02), cô lập schema-per-dataset (RT-17). Không mô phỏng
  # được — chúng là hành vi của PostgreSQL, nên job này chạy DB thật.
  # ---------------------------------------------------------------------------
  server-db:
    name: server · test có PostgreSQL
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chỉ job này được ghi vào PR (bình luận độ phủ). Quyền cấp ở mức job chứ
    # không ở mức workflow: các job còn lại — gồm cả job dựng Rust kéo về hàng
    # trăm crate — không có lý do gì cần quyền ghi.
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        # Ghim phiên bản: hành vi RLS/quyền phải giống bản khách hàng chạy.
        image: postgres:16
        env:
          # Bộ test tự tạo `ket_owner`/`ket_app` **không mật khẩu** (bản cài
          # thật đặt mật khẩu từ OS keystore — ADR-019). Dùng đúng công tắc mà
          # image hỗ trợ, thay vì sửa `pg_hba.conf` qua `docker exec`:
          # `pg_ctl reload` khi đó chạy dưới root và PostgreSQL từ chối.
          #
          # `trust` chỉ áp cho container CI dùng một lần. Bản cài khách hàng đi
          # đường ngược lại: `scram-sha-256` + `pg_hba` cứng (RT-06, phase 11).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Không có DB thì job này phải ĐỎ, không được "xanh vì bỏ qua".
      KET_TEST_REQUIRE_DB: "1"
      # Nhóm `db` xóa/dựng lại vai trò ở phạm vi cụm — an toàn ở đây vì service
      # container dùng một lần, nhưng phải khẳng định tường minh (xem
      # `tests/conftest.py::_drop_ket_roles`).
      KET_TEST_DESTRUCTIVE_CLUSTER: "1"
      KET_TEST_ADMIN_DSN: postgresql+psycopg://postgres@localhost:5432/postgres
      KET_TEST_KET_OWNER_DSN: postgresql+psycopg://ket_owner@localhost:5432/ket_test
      KET_TEST_KET_APP_DSN: postgresql+psycopg://ket_app@localhost:5432/ket_test

    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc
        run: uv sync --python ${{ env.PYTHON_VERSION }}

      # Chạy TOÀN BỘ bộ test ở đây, không chỉ nhóm `db`, để con số độ phủ có
      # nghĩa: phần lớn `kernel/security` và `kernel/datasets` chỉ chạy được khi
      # có PostgreSQL, nên đo riêng nhóm không-DB sẽ cho ra một con số thấp giả.
      # Nhóm không-DB vẫn chạy riêng ở job `server-tests` — ở đó câu hỏi khác:
      # "còn chạy đúng trên Windows/macOS không".
      - name: pytest toàn bộ + đo độ phủ
        run: uv run pytest --cov --cov-report=term-missing

      - name: Tổng hợp độ phủ
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          total=$(uv run coverage report --format=total)
          {
            echo "## Độ phủ test: **${total}%**"
            echo
            echo "Đo trên \`server/src/ket\` với toàn bộ bộ test (gồm nhóm cần PostgreSQL)."
            echo "Tệp phủ 100% được ẩn cho gọn."
            echo
            uv run coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"
          echo "COVERAGE_TOTAL=$total" >> "$GITHUB_ENV"

      # Dán vào PR dưới dạng **một** bình luận được cập nhật tại chỗ, không phải
      # một bình luận mới mỗi lần push — mốc HTML ẩn ở đầu thân bình luận là thứ
      # để tìm lại nó. Dùng `gh api` thay vì action bên thứ ba: ít một mắt xích
      # trong chuỗi cung ứng cho một việc chỉ có hai lệnh gọi.
      - name: Dán độ phủ vào PR
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- ket-coverage -->'
          {
            echo "$marker"
            echo "### Độ phủ test: **${COVERAGE_TOTAL}%**"
            echo
            echo "<details><summary>Chi tiết theo tệp (ẩn tệp phủ 100%)</summary>"
            echo
            uv run coverage report --format=markdown --skip-covered
            echo
            echo "</details>"
            echo
            echo "_Đo trên \`server/src/ket\`, toàn bộ bộ test. Cập nhật ở mỗi lần push._"
          } > /tmp/coverage-comment.md

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id] | first // empty")

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@/tmp/coverage-comment.md >/dev/null
            echo "Đã cập nhật bình luận $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" \
              -F body=@/tmp/coverage-comment.md >/dev/null
            echo "Đã tạo bình luận độ phủ"
          fi

  # ---------------------------------------------------------------------------
  # Web UI. Bundle web không phụ thuộc HĐH → một lần trên Linux là đủ.
  #
  # Chỉ chạy trên PR, và chỉ khi job đóng gói desktop KHÔNG chạy: `tauri build`
  # gọi `pnpm build` (`tsc --noEmit && vite build`) nên nó đã bao trọn phần việc
  # này. Hai job cùng chạy = dựng lại y hệt một bundle hai lần.
  # ---------------------------------------------------------------------------
  client:
    name: client · kiểu, lint, build
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.client == 'true'
      && needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

      - name: eslint
        run: pnpm exec eslint .

      - name: vite build
        run: pnpm exec vite build

  # ---------------------------------------------------------------------------
  # Đóng gói desktop — job đắt nhất (biên dịch Rust + dựng installer, và runner
  # macOS tính giá gấp 10 lần Linux). Chỉ chạy khi kết quả có thể khác lần trước:
  #   * PR có đụng `client/src-tauri/**` — đổi shell thì phải biết còn đóng gói được
  #   * merge vào master có đụng `client/**` — cổng phát hành thật
  #   * chạy định kỳ hằng tuần — bắt trôi phụ thuộc (crate/SDK cập nhật làm hỏng
  #     bản dựng dù mã của ta không đổi dòng nào)
  #
  # Merge chỉ đụng server thì KHÔNG dựng lại: bản đóng gói desktop không phụ
  # thuộc mã server, kết quả sẽ y hệt lần trước.
  # Chỉ dựng cho hai nền tảng của v1 (LD-02) — Ubuntu không nằm trong phạm vi.
  # ---------------------------------------------------------------------------
  desktop-bundle:
    name: desktop · đóng gói (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true'
      || (github.event_name != 'pull_request' && needs.changes.outputs.client == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm exec eslint .

      - name: cargo fmt --check
        working-directory: client/src-tauri
        run: cargo fmt --check

      - name: cargo clippy (warning = lỗi)
        working-directory: client/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Bao luôn `tsc --noEmit` + `vite build` qua `beforeBuildCommand`.
      #
      # Cần khóa ký updater y như `release.yml`: từ khi `tauri.conf.json` bật
      # `createUpdaterArtifacts`, **mọi** `tauri build` đều sinh gói cập nhật và
      # đổ nếu thiếu khóa ("A public key has been found, but no private key").
      # Truyền secret ở đây không phải để phát hành — job này không tải gì lên —
      # mà để nó dựng đúng **cùng một đường** với bản phát hành thật. Một job
      # đóng gói chạy đường khác với đường phát hành thì nó canh nhầm thứ.
      - name: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build

  # ---------------------------------------------------------------------------
  # Cổng duy nhất để đặt vào branch protection.
  #
  # Job con dùng `if:` nên có thể bị BỎ QUA; đặt từng job làm required check sẽ
  # chặn PR không đụng tới vùng đó. Job này tổng hợp: bỏ qua = chấp nhận, đỏ =
  # chặn. Thêm job mới thì thêm vào `needs` — quên thì nó không được canh.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI
    if: always()
    needs: [changes, server-quality, server-tests, server-db, client, desktop-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tổng hợp kết quả
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > results.json
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' results.json | sort | tee -a "$GITHUB_STEP_SUMMARY"

          failed=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key' results.json)

          if [ -n "$failed" ]; then
            echo "::error::Job không đạt: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "Tất cả cổng đã đạt (hoặc được bỏ qua vì không liên quan)."
