name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cổng phía server: kiểu tĩnh + luật phụ thuộc + cấm float trong code nghiệp vụ.
  # Chạy trên cả ba OS vì đội phát triển trên macOS còn khách hàng chạy Windows.
  server:
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc (Python 3.12)
        run: uv sync --python 3.12

      - name: ruff
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy

      # import-linter mở file .ini bằng encoding mặc định của locale (xem
      # adapters/filesystem.py: `open(file_name, encoding=None)`), nên trên
      # Windows là cp1252 và tiếng Việt trong importlinter.ini làm nó chết với
      # UnicodeDecodeError. Bật UTF-8 mode cho riêng bước này để `open()` mặc
      # định là UTF-8.
      #
      # Chỉ đặt ở bước này, không đặt cho cả job: pytest phải chạy đúng locale
      # thật của Windows, nếu không CI sẽ xanh trong khi máy khách hàng lỗi.
      - name: import-linter (luật phụ thuộc — ADR-004)
        env:
          PYTHONUTF8: "1"
        run: uv run lint-imports --config importlinter.ini

      # Nhóm `db` cần service container PostgreSQL — chỉ chạy được trên runner
      # Linux, nên nó có job riêng bên dưới. Ở đây loại trừ tường minh thay vì
      # để nó tự bỏ qua: một bộ test "xanh vì không kết nối được DB" là tín
      # hiệu tệ hơn không có tín hiệu.
      - name: pytest (không cần DB)
        run: uv run pytest -m "not db"

      # mypy strict là hàng rào duy nhất bù cho việc Python không kiểm kiểu lúc
      # biên dịch (ADR-015). Đếm số `# type: ignore` mỗi lần chạy để thấy nó
      # trôi dần, thay vì phát hiện sau sáu tháng.
      #
      # `grep` trả exit 1 khi KHÔNG tìm thấy gì — tức đúng lúc repo sạch nhất.
      # GitHub Actions chạy `bash -eo pipefail` nên phải chặn exit đó, nếu không
      # cổng bị lật ngược: chỉ xanh khi có ai đó THÊM `# type: ignore`.
      #
      # Ngưỡng là cổng thật, không phải dòng log. Nới ngưỡng phải sửa file này
      # trong PR và nêu lý do — đó chính là điểm kiểm soát ta muốn.
      - name: "Đếm `# type: ignore` (ngưỡng ADR-015)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          MAX_TYPE_IGNORE: 0
        run: |
          count=$(grep -rn "type: ignore" src/ | wc -l | tr -d ' ') || count=0
          echo "Số \`# type: ignore\` trong src/: $count (ngưỡng: $MAX_TYPE_IGNORE)"
          echo "\`# type: ignore\`: $count / ngưỡng $MAX_TYPE_IGNORE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt "$MAX_TYPE_IGNORE" ]; then
            echo "::error::Vượt ngưỡng \`# type: ignore\` ($count > $MAX_TYPE_IGNORE) — xem ADR-015"
            exit 1
          fi

  # Cổng bảo mật dữ liệu: RLS cô lập chi nhánh (RT-04), nhật ký bất biến bằng
  # tách quyền sở hữu (RT-02), cô lập schema-per-dataset (RT-17). Không mô
  # phỏng được — chúng là hành vi của PostgreSQL, nên job này chạy DB thật.
  server-db:
    name: server-db (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        # Ghim phiên bản: hành vi RLS/quyền phải giống bản khách hàng chạy.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Vai trò `konek_owner`/`konek_app` do chính bộ test tạo (bootstrap dựng
      # cụm). Chỉ DSN superuser là phải cấp từ ngoài.
      # Không có DB thì job này phải ĐỎ, không được "xanh vì bỏ qua".
      KONEK_TEST_REQUIRE_DB: "1"
      KONEK_TEST_ADMIN_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      KONEK_TEST_KONEK_OWNER_DSN: postgresql+psycopg://konek_owner@localhost:5432/konek_test
      KONEK_TEST_KONEK_APP_DSN: postgresql+psycopg://konek_app@localhost:5432/konek_test

    steps:
      - uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Đồng bộ phụ thuộc (Python 3.12)
        run: uv sync --python 3.12

      # Vai trò test đăng nhập không mật khẩu; image postgres mặc định dùng
      # `scram-sha-256` cho kết nối host nên phải mở `trust` cho riêng container
      # CI này. Bản cài thật làm ngược lại — xem `security/roles.sql` và RT-06.
      - name: Cho phép đăng nhập không mật khẩu trong container CI
        run: |
          docker exec $(docker ps -qf ancestor=postgres:16) bash -c \
            "echo 'host all all all trust' > /var/lib/postgresql/data/pg_hba.conf && \
             echo 'local all all trust' >> /var/lib/postgresql/data/pg_hba.conf"
          docker exec $(docker ps -qf ancestor=postgres:16) pg_ctl reload -D /var/lib/postgresql/data

      - name: pytest (nhóm cần PostgreSQL)
        run: uv run pytest -m db

  client:
    name: client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

      - name: eslint
        run: pnpm exec eslint .

      - name: vite build
        run: pnpm exec vite build

  # Đóng gói desktop chỉ chạy trên hai nền tảng đích của v1 (LD-02).
  # Ubuntu không nằm trong phạm vi nên không dựng bản Linux.
  tauri:
    name: tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Cài phụ thuộc
        run: pnpm install --frozen-lockfile

      - name: cargo fmt --check
        working-directory: client/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: client/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: tauri build
        run: pnpm exec tauri build
